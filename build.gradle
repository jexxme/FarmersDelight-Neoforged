plugins {
    id 'java-library'
//    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'net.ltgt.errorprone' version '5.2.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Jar name: FarmersDelight-Neoforged-MC26.3-FD1.3.4-2.jar (MC26.1-26.1.1 when a jar covers several Minecraft versions)
def releaseGames = project.release_game_versions.split(',')
version = "MC${releaseGames.length > 1 ? releaseGames.first() + '-' + releaseGames.last() : releaseGames.first()}-FD${mod_version}"
group = 'vectorwing.farmersdelight'

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude(".cache")
}

repositories {
    maven {
        // JEI
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // CraftTweaker
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven { url "https://maven.ryanliptak.com/" }
    maven {
        // EMI
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        // REI, Cloth Config and Architectury
        url = "https://maven.shedaniel.me/"
        content {
            includeGroupByRegex(/me\.shedaniel.*/)
            includeGroup("dev.architectury")
        }
    }
}

base {
    archivesName = 'FarmersDelight-Neoforged'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // Playtest clients (see playtest-template/README.md). They use their own game directories under playtest/.
        playtestClient {
            client()
            gameDirectory = project.file('playtest/client')
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
        }

        playtestSolo {
            client()
            gameDirectory = project.file('playtest/solo')
            programArguments.addAll '--quickPlaySingleplayer', 'FD Playtest'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file(project.findProperty('datagenOutput') ?: 'src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Static analysis, see the "Guards" section at the end of this file
    errorprone "com.google.errorprone:error_prone_core:2.52.0"

    // JEI (in the dev client unless -Prei=true is set; JEI and REI don't share a screen nicely)
    compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft}-neoforge-api:${jei_version}"
    if (!project.hasProperty('rei')) {
        localRuntime "mezz.jei:jei-${jei_minecraft}-neoforge:${jei_version}"
    }

    // REI (optional integration). Run the dev client with -Prei=true to test it.
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}") { transitive = false }
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    if (project.hasProperty('rei')) {
        localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
        localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
        localRuntime "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    }

    // EMI
//    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
//    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    // AppleSkin
    compileOnly "squeek.appleskin:appleskin-neoforge:${appleskin_version}:api"
    runtimeOnly "squeek.appleskin:appleskin-neoforge:${appleskin_version}"

//    def ctDep = "com.blamejared.crafttweaker:CraftTweaker-neoforge-${crafttweaker_minecraft}:${crafttweaker_version}"
//    compileOnly ctDep
//    runtimeOnly ctDep
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '5000']
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

////////////////

//compileJava {
//    options.compilerArgs << "-Acrafttweaker.processor.document.output_directory=${file('docsOut')}"
//}


// Ship the MIT license notice inside the jar
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { 'LICENSE_farmersdelight' }
    }
}


//////////////// Guards
// Checks that catch bug classes the compiler doesn't, after they slipped through once. Run with `./gradlew check`.

// Every method that overrides something must say @Override. When Minecraft/NeoForge removes or renames a hook
// (like Block#onRemove in 26.x), the build then fails instead of the method silently never being called again.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        error('MissingOverride')
    }
}

// Code patterns that compile fine but were real bugs in this port. Suppress a deliberate use with a
// trailing `// guard:allow <rule>` comment on the same line.
def forbiddenPatterns = [
    [rule: 'bare-toStack',
     regex: ~/\.toStack\(\)/,
     why: 'ItemResource#toStack() is a COPY with count 1. Use toStack(handler.getAmountAsInt(slot)) and write changes back with handler.set(...).'],
    [rule: 'empty-ingredient',
     regex: ~/Ingredient\.of\(\s*\)/,
     why: 'An empty Ingredient throws in 26.x (also when decoded on the client). Use Optional/empty lists instead.'],
    [rule: 'empty-identity',
     regex: ~/[=!]=\s*ItemStack\.EMPTY|ItemStack\.EMPTY\s*[=!]=/,
     why: 'Empty stacks are not always the ItemStack.EMPTY instance (copyWithCount(0), split, shrink). Use isEmpty(). This caused a tool dupe on the cutting board.'],
    [rule: 'removed-hook-onRemove',
     regex: ~/\bvoid\s+onRemove\s*\(/,
     why: 'Block#onRemove no longer exists in 26.x. Drop contents in BlockEntity#preRemoveSideEffects, update neighbours in Block#affectNeighborsAfterRemoval.'],
]

tasks.register('checkForbiddenPatterns') {
    group = 'verification'
    description = 'Fails on code patterns that caused bugs in the 26.x port (see build.gradle).'
    def sources = fileTree('src/main/java') { include '**/*.java' }
    def root = projectDir.toPath()
    def patterns = forbiddenPatterns
    inputs.files(sources)
    doLast {
        def problems = []
        sources.each { File file ->
            def lines = file.readLines('UTF-8')
            def rel = root.relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
            lines.eachWithIndex { String line, int i ->
                def code = line.replaceFirst(/\/\/.*$/, '')
                patterns.each { p ->
                    if (code =~ p.regex && !line.contains("guard:allow ${p.rule}")) {
                        problems << "${rel}:${i + 1}: [${p.rule}] ${line.trim()}\n    ${p.why}"
                    }
                }
            }
            // The block entity is already gone in Block#affectNeighborsAfterRemoval: reading it there always returns null.
            int depth = -1
            lines.eachWithIndex { String line, int i ->
                if (depth < 0 && line =~ /\baffectNeighborsAfterRemoval\s*\(/ && !line.trim().endsWith(';')) {
                    depth = 0
                }
                if (depth >= 0) {
                    if (line.contains('getBlockEntity(') && !line.contains('guard:allow be-in-removal')) {
                        problems << "${rel}:${i + 1}: [be-in-removal] ${line.trim()}\n    The block entity is already removed here in 26.x. Move this to BlockEntity#preRemoveSideEffects."
                    }
                    depth += line.count('{') - line.count('}')
                    if (depth <= 0 && line.contains('}')) depth = -1
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Forbidden patterns found (${problems.size()}):\n" + problems.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkForbiddenPatterns'
}

