modLoader = "javafml"
loaderVersion = "${loader_version_range}"
# Farmer's Delight Neoforged: bug reports go to this project's own tracker, not to the original Farmer's Delight.
issueTrackerURL = "https://github.com/jexxme/FarmersDelight-Neoforged/issues"
license="${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/farmers-delight-neoforged"
bannerFile = "banner.png"
iconFile = "icon.png"
logoBlur = false
credits = "Original mod by vectorwing (https://github.com/vectorwing/FarmersDelight). 26.x groundwork by the Farmer's Delight Refabricated team (MehVahdJukaar, Cassian, AyOhEe). Farmer's Delight contributors: Chloe Dawn, Grimmauld, CDAGaming, TelepathicGrunt, XFactHD, GizmoThemoonPig, ConductiveFoam, simibubi, MerchantPug, Jozufozu, bagel, Silk, SkySom, Eutro, RaymondBlaze and many others!"
authors = "${mod_authors}"
description = "${mod_description}"
enumExtensions="META-INF/enumextensions.json"
## Catalogue mod compatibility
itemIcon = "farmersdelight:stove"
configBackground = "minecraft:textures/block/bricks.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange="${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
